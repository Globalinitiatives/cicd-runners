
[unix_http_server]
file=/opt/cicd/supervisor/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=cicd
logfile=/opt/cicd/supervisor/supervisord.log
pidfile=/opt/cicd/supervisor/supervisord.pid
childlogdir=/opt/cicd/supervisor/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///opt/cicd/supervisor/supervisor.sock

[include]
files=/opt/cicd/supervisor/conf.d/*.ini
