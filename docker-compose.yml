services:
  cicd:
    build:
      context: .
      dockerfile: dockerfile
      args:
        DOCKER_GID: "${DOCKER_GID:-999}"
    image: cicd-environment:latest
    container_name: cicd-environment
    hostname: cicd-environment
    restart: unless-stopped
    init: true
    working_dir: /opt/cicd

    # The image already contains the user, socket group, and Supervisor entrypoint.
    # Add the host socket GID at runtime in case the base image uses a different name.
    group_add:
      - "${DOCKER_GID:-999}"

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    volumes:
      # Docker socket access grants the runner host-equivalent Docker control.
      # Only run trusted jobs with this service.
      - /var/run/docker.sock:/var/run/docker.sock
      - cicd-data:/opt/cicd

volumes:
  cicd-data:
